- insert:
    - id: privacy-router
      name: dsh-privacy-router
      config:
        localProvider: !!js process.env.PRIVACY_ROUTER_LOCAL_PROVIDER || ''
        localModel: !!js process.env.PRIVACY_ROUTER_LOCAL_MODEL || ''
        cloudProvider: !!js process.env.PRIVACY_ROUTER_CLOUD_PROVIDER || 'deepseek-official'
        cloudModel: !!js process.env.PRIVACY_ROUTER_CLOUD_MODEL || 'deepseek-flash'
        trustedProviderPrefixes:
          - local-ai-
